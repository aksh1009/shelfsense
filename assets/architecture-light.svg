<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="980" height="470" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818b98"/></marker></defs><text x="24" y="36" font-size="18" font-weight="600" fill="#1f2328">ShelfSense architecture</text><text x="24" y="58" font-size="13" fill="#59636e">Three processes. Images travel as bytes over HTTP; each model loads once at startup.</text><rect x="24" y="196" width="150" height="96" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><text x="99" y="234" font-size="14" font-weight="600" text-anchor="middle" fill="#1f2328">Client</text><text x="99" y="256" font-size="12" text-anchor="middle" fill="#59636e">web page or curl</text><rect x="270" y="156" width="270" height="168" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><path d="M270 166 a10 10 0 0 1 10 -10 h250 a10 10 0 0 1 10 10 v26 h-270 z" fill="#2a78d6"/><text x="284" y="179" font-size="14" font-weight="600" fill="#ffffff">Gateway</text><text x="526" y="179" font-size="12" text-anchor="end" fill="#ffffff" opacity="0.9">Flask :8000</text><circle cx="288" cy="214" r="2.5" fill="#2a78d6"/><text x="298" y="218" font-size="13" fill="#1f2328">Web interface and REST API</text><circle cx="288" cy="238" r="2.5" fill="#2a78d6"/><text x="298" y="242" font-size="13" fill="#1f2328">Decode image, fix EXIF rotation</text><circle cx="288" cy="262" r="2.5" fill="#2a78d6"/><text x="298" y="266" font-size="13" fill="#1f2328">Draw colour-coded visualization</text><circle cx="288" cy="286" r="2.5" fill="#2a78d6"/><text x="298" y="290" font-size="13" fill="#1f2328">Save result, return JSON</text><rect x="660" y="92" width="296" height="140" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><path d="M660 102 a10 10 0 0 1 10 -10 h276 a10 10 0 0 1 10 10 v26 h-296 z" fill="#eb6834"/><text x="674" y="115" font-size="14" font-weight="600" fill="#ffffff">Detector service</text><text x="942" y="115" font-size="12" text-anchor="end" fill="#ffffff" opacity="0.9">:8001</text><circle cx="678" cy="150" r="2.5" fill="#eb6834"/><text x="688" y="154" font-size="13" fill="#1f2328">YOLO11n trained on SKU-110K</text><circle cx="678" cy="174" r="2.5" fill="#eb6834"/><text x="688" y="178" font-size="13" fill="#1f2328">640 px, conf 0.25, NMS IoU 0.7</text><circle cx="678" cy="198" r="2.5" fill="#eb6834"/><text x="688" y="202" font-size="13" fill="#1f2328">Containment suppression 0.8</text><rect x="660" y="266" width="296" height="140" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/><path d="M660 276 a10 10 0 0 1 10 -10 h276 a10 10 0 0 1 10 10 v26 h-296 z" fill="#1baf7a"/><text x="674" y="289" font-size="14" font-weight="600" fill="#ffffff">Grouping service</text><text x="942" y="289" font-size="12" text-anchor="end" fill="#ffffff" opacity="0.9">:8002</text><circle cx="678" cy="324" r="2.5" fill="#1baf7a"/><text x="688" y="328" font-size="13" fill="#1f2328">Crop each product, pad to square</text><circle cx="678" cy="348" r="2.5" fill="#1baf7a"/><text x="688" y="352" font-size="13" fill="#1f2328">CLIP ViT-B/16, 512-d embeddings</text><circle cx="678" cy="372" r="2.5" fill="#1baf7a"/><text x="688" y="376" font-size="13" fill="#1f2328">Agglomerative, cosine 0.20</text><line x1="176" y1="228" x2="266" y2="228" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="221" y="220" font-size="12" fill="#59636e" text-anchor="middle">photo</text><circle cx="221" cy="200" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.4"/><text x="221" y="204" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">1</text><line x1="266" y1="260" x2="176" y2="260" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="221" y="278" font-size="12" fill="#59636e" text-anchor="middle">JSON</text><circle cx="221" cy="300" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.4"/><text x="221" y="304" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">4</text><line x1="542" y1="190" x2="656" y2="152" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="622" y="150" font-size="12" fill="#59636e" text-anchor="middle">image bytes</text><circle cx="562" cy="183" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.4"/><text x="562" y="187" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">2</text><line x1="656" y1="176" x2="542" y2="214" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="612" y="214" font-size="12" fill="#59636e" text-anchor="middle">boxes</text><line x1="542" y1="276" x2="656" y2="314" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="608" y="270" font-size="12" fill="#59636e" text-anchor="middle">image + boxes</text><circle cx="562" cy="283" r="10" fill="#ffffff" stroke="#818b98" stroke-width="1.4"/><text x="562" y="287" font-size="11" font-weight="600" text-anchor="middle" fill="#1f2328">3</text><line x1="656" y1="338" x2="542" y2="300" stroke="#818b98" stroke-width="1.6" marker-end="url(#head)"/><text x="590" y="340" font-size="12" fill="#59636e" text-anchor="middle">group ids</text><text x="24" y="448" font-size="12" fill="#59636e">Numbers show the order of one request. The detector and grouping services are stateless and can be scaled independently.</text></svg>